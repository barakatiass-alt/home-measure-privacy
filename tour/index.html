<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Tour</title>
<meta name="description" content="3D tour of a home measured with Home Measure.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://*.supabase.co https://*.workers.dev; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<style>
  :root { --ink:#11262A; --muted:#5B6B6E; --accent:#0A766F; --card:#ffffff; --bg:#F4F7F6; --line:rgba(17,38,42,.12); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#E7EFEE; --muted:#9DB0AE; --card:#16262A; --bg:#0D1A1D; --line:rgba(255,255,255,.14); } }
  :root[data-theme="dark"] { --ink:#E7EFEE; --muted:#9DB0AE; --card:#16262A; --bg:#0D1A1D; --line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; touch-action: none; display: block; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 800; font-size: 12px; display: grid; place-items: center; flex: none; }
  .title { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
  .title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { color: var(--muted); font-size: 12px; }
  .title a { color: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 40px; white-space: nowrap; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 13px; background: var(--card); border-radius: 10px; padding: 6px 10px; align-self: flex-start; border: 1px solid var(--line); }
  #map { position: fixed; right: 16px; top: max(64px, calc(env(safe-area-inset-top) + 52px)); width: 132px; height: 132px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: none; }
  #status[hidden] { display: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  a.btn { font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; min-height: 40px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  a.btn[hidden] { display: none; }
  .mark img { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; background: #fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/",
  "splats": "../vendor/splats/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="map" data-t-label="map" aria-label="Map of the home; tap to walk there"></canvas>
<div id="status" data-t="loading">Loading the 3D home…</div>
<header>
  <div class="mark">HM</div>
  <div class="title"><b id="name" data-t="homeTour">Home tour</b><span><span data-t="measuredWith">Measured with</span> <a href="../" target="_blank" rel="noopener">Home Measure</a></span></div>
</header>
<div class="bar">
  <div class="hint" id="hint" data-t="hintModel">Drag to turn the model. Pinch or scroll to zoom.</div>
  <div class="row" id="rooms"></div>
  <div class="row">
    <button id="dollhouse" aria-pressed="true" data-t="dollhouse">Dollhouse</button>
    <button id="walk" aria-pressed="false" data-t="walk">Walk through</button>
    <button id="photo" aria-pressed="false" hidden data-t="photoreal">Photoreal</button>
    <a id="report" class="btn" target="_blank" rel="noopener" hidden data-t="report">Report (PDF)</a>
    <a id="ar" class="btn" rel="ar" hidden><img alt="" width="1" height="1" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><span data-t="ar">View in AR</span></a>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);

// The tour speaks the viewer's language (English, Hebrew right to left, or Thai).
const WORDS = {
  en: {
    homeTour: 'Home tour', measuredWith: 'Measured with', loading: 'Loading the 3D home…', failed: 'This tour could not be loaded. Ask for a new link.',
    hintModel: 'Drag to turn the model. Pinch or scroll to zoom.', hintWalk: 'Drag to look around. Tap the floor to walk there.',
    dollhouse: 'Dollhouse', walk: 'Walk through', photoreal: 'Photoreal', report: 'Report (PDF)', ar: 'View in AR', map: 'Map of the home; tap to walk there', tourTitle: 'Home Tour',
    rooms: { livingRoom: 'Living room', bedroom: 'Bedroom', bathroom: 'Bathroom', kitchen: 'Kitchen', diningRoom: 'Dining' },
  },
  he: {
    homeTour: 'סיור בבית', measuredWith: 'נמדד עם', loading: 'טוען את הבית בתלת־ממד…', failed: 'לא הצלחנו לטעון את הסיור. בקשו קישור חדש.',
    hintModel: 'גררו כדי לסובב את המודל. צבטו או גללו כדי להתקרב.', hintWalk: 'גררו כדי להסתכל מסביב. הקישו על הרצפה כדי ללכת לשם.',
    dollhouse: 'בית בובות', walk: 'הליכה בבית', photoreal: 'מציאותי', report: 'דוח (PDF)', ar: 'צפייה ב־AR', map: 'מפת הבית; הקישו כדי ללכת לשם', tourTitle: 'סיור בבית',
    rooms: { livingRoom: 'סלון', bedroom: 'חדר שינה', bathroom: 'חדר רחצה', kitchen: 'מטבח', diningRoom: 'פינת אוכל' },
  },
  th: {
    homeTour: 'ทัวร์บ้าน', measuredWith: 'วัดด้วย', loading: 'กำลังโหลดบ้าน 3 มิติ…', failed: 'โหลดทัวร์นี้ไม่ได้ ขอลิงก์ใหม่',
    hintModel: 'ลากเพื่อหมุนโมเดล บีบหรือเลื่อนเพื่อซูม', hintWalk: 'ลากเพื่อมองรอบๆ แตะพื้นเพื่อเดินไปที่นั่น',
    dollhouse: 'มุมมองบ้าน', walk: 'เดินชม', photoreal: 'สมจริง', report: 'รายงาน (PDF)', ar: 'ดูแบบ AR', map: 'แผนที่บ้าน แตะเพื่อเดินไปที่นั่น', tourTitle: 'ทัวร์บ้าน',
    rooms: { livingRoom: 'ห้องนั่งเล่น', bedroom: 'ห้องนอน', bathroom: 'ห้องน้ำ', kitchen: 'ห้องครัว', diningRoom: 'ห้องทานอาหาร' },
  },
};
function pickLang() {
  const asked = params.get('lang') || (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  const code = asked.slice(0, 2).toLowerCase();
  return code === 'he' || code === 'iw' ? 'he' : code === 'th' ? 'th' : 'en';
}
const LANG = pickLang();
const T = WORDS[LANG];
document.documentElement.lang = LANG;
if (LANG === 'he') document.documentElement.dir = 'rtl';
for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', T[el.dataset.tLabel]);
document.title = T.tourTitle;
/**
 * Models and splats load only from this site or a Home Measure storage bucket, so a
 * crafted link cannot show someone else's content under this page's name.
 */
function allowed(url) {
  if (!url) return null;
  try {
    const u = new URL(url, location.href);
    if (u.origin === location.origin) return u.href;
    if (u.protocol === 'https:' && u.hostname.endsWith('.supabase.co') && u.pathname.startsWith('/storage/v1/object/public/')) return u.href;
    if (u.protocol === 'https:' && u.hostname.endsWith('.workers.dev') && u.pathname.startsWith('/t/')) return u.href;
  } catch {}
  return null;
}
const src = allowed(params.get('model')) || 'sample.glb';
// Optional photoreal splat (.ply/.splat/.ksplat), trained from the same scan, so it
// shares the model's coordinates.
const splatSrc = allowed(params.get('splat'));
const homeName = params.get('name');
if (homeName) { document.getElementById('name').textContent = homeName; document.title = homeName + ' · ' + T.tourTitle; }

// "View in AR": the home's USDZ in iPhone Quick Look, where the browser supports it.
const usdz = allowed(params.get('usdz'));
const arLink = document.getElementById('ar');
if (usdz && arLink.relList?.supports?.('ar')) {
  arLink.href = usdz;
  arLink.hidden = false;
}

// The PDF report, when the home's owner shared it with the tour.
const reportUrl = allowed(params.get('report'));
if (reportUrl) {
  const link = document.getElementById('report');
  link.href = reportUrl;
  link.hidden = false;
}

// A designer's tour (Pro) carries their name, contact line and logo in tour.json.
const metaUrl = allowed(params.get('meta'));
if (metaUrl) {
  fetch(metaUrl).then((r) => (r.ok ? r.json() : null)).then((meta) => {
    const brand = meta?.brand;
    if (!brand?.name) return;
    const line = document.querySelector('.title span');
    line.textContent = brand.contact ? `${brand.name} · ${brand.contact}` : brand.name;
    if (typeof brand.logo === 'string' && brand.logo.startsWith('data:image/')) {
      const img = document.createElement('img');
      img.src = brand.logo;
      img.alt = brand.name;
      const mark = document.querySelector('.mark');
      mark.textContent = '';
      mark.style.background = 'none';
      mark.appendChild(img);
    }
  }).catch(() => {});
}

const canvas = document.getElementById('view');
const mapCanvas = document.getElementById('map');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const mapRenderer = new THREE.WebGLRenderer({ canvas: mapCanvas, antialias: true, alpha: true });
mapRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
mapRenderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#F4F7F6');
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a4, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(4, 10, 6);
scene.add(sun);

const orbitCam = new THREE.PerspectiveCamera(50, 1, 0.05, 500);
const walkCam = new THREE.PerspectiveCamera(75, 1, 0.05, 200);
walkCam.rotation.order = 'YXZ';
const controls = new OrbitControls(orbitCam, canvas);
controls.enableDamping = true;
const mapCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const EYE = 1.6;
let mode = 'dollhouse';
let floorY = 0;
const floors = [];
let box = null;
let target = null;
let yaw = 0;
let pitch = -0.1;

// The walker on the minimap: a dot with a heading cone, drawn only into the map.
const marker = new THREE.Group();
const markerMat = new THREE.MeshBasicMaterial({ color: 0x0A766F, depthTest: false });
const dot = new THREE.Mesh(new THREE.CircleGeometry(0.35, 24), markerMat);
dot.rotation.x = -Math.PI / 2;
const cone = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 16), markerMat);
cone.rotation.x = -Math.PI / 2;
cone.position.z = -0.5;
marker.add(dot, cone);
marker.renderOrder = 10;
marker.visible = false;
scene.add(marker);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const aspect = innerWidth / innerHeight;
  // Walking on a portrait phone: widen the view so it shows about 57° across, not 38°.
  walkCam.fov = aspect < 1 ? Math.min(100, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(35)) / aspect))) : 75;
  for (const cam of [orbitCam, walkCam]) { cam.aspect = aspect; cam.updateProjectionMatrix(); }
  mapRenderer.setSize(132, 132);
}
addEventListener('resize', resize);
resize();

let model = null;
let splats = null;
let photoreal = false;
/** Loads the measured model (and optional splat), replacing whatever was shown. */
function loadModel(modelUrl, splat) {
  if (model) scene.remove(model);
  if (splats) { scene.remove(splats); splats.dispose?.(); splats = null; }
  floors.length = 0;
  document.getElementById('rooms').replaceChildren();
  document.getElementById('photo').hidden = true;
  photoreal = false;
  new GLTFLoader().load(modelUrl, (gltf) => {
  model = gltf.scene;
  scene.add(model);
  if (splat) loadSplats(splat.url, splat.name);
  model.traverse((o) => { if (o.isMesh && /Floor/.test(o.name)) floors.push(o); });
  box = new THREE.Box3().setFromObject(model);
  floorY = box.min.y;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  // Far enough that the whole home fits, also across a narrow portrait phone screen.
  const radius = Math.max(size.length() / 2, 1.5);
  const vHalf = THREE.MathUtils.degToRad(orbitCam.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * (innerWidth / innerHeight));
  const distance = (radius / Math.sin(Math.min(vHalf, hHalf))) * 1.05;
  const dir = new THREE.Vector3(0.6, 1.0, 0.8).normalize();
  orbitCam.position.copy(center).addScaledVector(dir, distance);
  controls.target.copy(center);
  controls.update();
  const half = (Math.max(size.x, size.z) / 2) * 1.1;
  Object.assign(mapCam, { left: -half, right: half, top: half, bottom: -half });
  mapCam.position.set(center.x, box.max.y + 20, center.z);
  mapCam.up.set(0, 0, -1);
  mapCam.lookAt(center.x, 0, center.z);
  mapCam.updateProjectionMatrix();

  // RoomPlan's rooms come as empty nodes named like "livingRoom0".
  const rooms = [];
  model.traverse((o) => {
    const m = /^(livingRoom|bedroom|bathroom|kitchen|diningRoom)/.exec(o.name || '');
    if (m && !o.isMesh && !o.name.includes('_')) rooms.push({ kind: m[1], pos: o.getWorldPosition(new THREE.Vector3()) });
  });
  const labels = T.rooms;
  const seen = {};
  const roomsRow = document.getElementById('rooms');
  for (const room of rooms) {
    const total = rooms.filter((x) => x.kind === room.kind).length;
    seen[room.kind] = (seen[room.kind] || 0) + 1;
    const b = document.createElement('button');
    b.textContent = labels[room.kind] + (total > 1 ? ' ' + seen[room.kind] : '');
    b.onclick = () => { setMode('walk'); walkTo(room.pos); };
    roomsRow.appendChild(b);
  }
  const start = rooms.find((x) => x.kind === 'livingRoom') || rooms[0];
  walkCam.position.set(start ? start.pos.x : center.x, floorY + EYE, start ? start.pos.z : center.z);
  // Face into the home rather than the nearest wall.
  const look = center.clone().sub(walkCam.position);
  if (look.lengthSq() > 0.25) yaw = Math.atan2(-look.x, -look.z);
  status.hidden = true;
  }, (e) => {
    // On a slow connection show how far the download is.
    if (e.total) status.textContent = `${T.loading} ${Math.round((e.loaded / e.total) * 100)}%`;
  }, () => { status.hidden = false; status.textContent = T.failed; });
}
// In the app (?app=1) the page waits for the home's own files instead of the sample.
if (params.get('app') !== '1') loadModel(src, splatSrc ? { url: splatSrc, name: splatSrc } : null);

// The Home Measure app shows a home's files from the iPhone here (ModelWebView.swift):
// it sends each file as base64 chunks with hmReceive(name, data), then calls hmShow().
const incoming = new Map();
window.hmReceive = (name, b64) => {
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  if (!incoming.has(name)) incoming.set(name, []);
  incoming.get(name).push(bytes);
  return incoming.get(name).length;
};
window.hmShow = (title) => {
  const file = (re) => {
    const name = [...incoming.keys()].find((n) => re.test(n));
    return name ? { url: URL.createObjectURL(new Blob(incoming.get(name))), name } : null;
  };
  const glb = file(/\.glb$/i);
  const splat = file(/\.(ply|splat|ksplat)$/i);
  incoming.clear();
  if (title) document.getElementById('name').textContent = title;
  if (glb) loadModel(glb.url, splat);
  return glb ? 1 : 0;
};
window.webkit?.messageHandlers?.hm?.postMessage({ type: 'ready' });

// Files dropped on the page (a .glb and optionally a .ply/.splat/.ksplat trained on a
// computer) open right here, without uploading them anywhere.
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  const files = [...e.dataTransfer.files];
  const glb = files.find((f) => /\.glb$/i.test(f.name));
  const splat = files.find((f) => /\.(ply|splat|ksplat)$/i.test(f.name));
  if (!glb) return;
  if (homeName === null) document.getElementById('name').textContent = glb.name.replace(/\.glb$/i, '').replace(/[-_]+/g, ' ');
  loadModel(URL.createObjectURL(glb), splat ? { url: URL.createObjectURL(splat), name: splat.name } : null);
});

async function loadSplats(url, name) {
  try {
    const { DropInViewer, SceneRevealMode, SceneFormat } = await import('splats');
    splats = new DropInViewer({ sharedMemoryForWorkers: false, gpuAcceleratedSort: false, sceneRevealMode: SceneRevealMode.Instant });
    const format = /\.ksplat$/i.test(name) ? SceneFormat.KSplat : /\.splat$/i.test(name) ? SceneFormat.Splat : SceneFormat.Ply;
    await splats.addSplatScene(url, { showLoadingUI: false, progressiveLoad: false, format });
    splats.visible = false;
    scene.add(splats);
    const button = document.getElementById('photo');
    button.hidden = false;
    button.onclick = () => setPhotoreal(!photoreal);
    setPhotoreal(true);
  } catch {
    // The measured model still works without the photoreal layer.
  }
}

/** Photoreal: the splat replaces the measured surfaces (furniture boxes hide too). */
function setPhotoreal(on) {
  photoreal = on && !!splats;
  document.getElementById('photo').setAttribute('aria-pressed', String(photoreal));
  if (splats) splats.visible = photoreal;
  model.traverse((o) => { if (o.isMesh) o.visible = !photoreal || /Floor/.test(o.name); });
  for (const f of floors) f.material.visible = !photoreal;
}

function setMode(next) {
  mode = next;
  document.getElementById('dollhouse').setAttribute('aria-pressed', String(mode === 'dollhouse'));
  document.getElementById('walk').setAttribute('aria-pressed', String(mode === 'walk'));
  controls.enabled = mode === 'dollhouse';
  mapCanvas.style.display = mode === 'walk' ? 'block' : 'none';
  hint.textContent = mode === 'walk' ? T.hintWalk : T.hintModel;
}
document.getElementById('dollhouse').onclick = () => setMode('dollhouse');
document.getElementById('walk').onclick = () => setMode('walk');

function walkTo(p) { target = new THREE.Vector3(p.x, floorY + EYE, p.z); }

// Walking: drag to look around, tap (without dragging) to walk to the tapped floor point.
const ray = new THREE.Raycaster();
let drag = null;
canvas.addEventListener('pointerdown', (e) => { if (mode === 'walk') drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  drag.x = e.clientX;
  drag.y = e.clientY;
  yaw += dx * 0.005;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.005));
});
function floorHit(p, cam) {
  ray.setFromCamera(p, cam);
  return ray.intersectObjects(floors.length ? floors : scene.children, true)[0];
}
addEventListener('pointerup', (e) => {
  if (drag && drag.moved < 6) {
    const hit = floorHit(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), walkCam);
    if (hit) walkTo(hit.point);
  }
  drag = null;
});
mapCanvas.addEventListener('click', (e) => {
  const r = mapCanvas.getBoundingClientRect();
  const hit = floorHit(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), mapCam);
  if (hit) walkTo(hit.point);
});
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode !== 'walk') {
    controls.update();
    renderer.render(scene, orbitCam);
    return;
  }
  walkCam.rotation.set(pitch, yaw, 0);
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const step = 1.6 * dt;
  const move = new THREE.Vector3();
  if (keys.w || keys.arrowup) move.add(forward);
  if (keys.s || keys.arrowdown) move.sub(forward);
  if (keys.a || keys.arrowleft) move.sub(right);
  if (keys.d || keys.arrowright) move.add(right);
  if (move.lengthSq() > 0) { walkCam.position.addScaledVector(move.normalize(), step); target = null; }
  if (target) {
    const d = target.clone().sub(walkCam.position);
    if (d.length() < 0.02) target = null;
    else walkCam.position.addScaledVector(d, Math.min(1, dt * 4));
  }
  renderer.render(scene, walkCam);
  marker.visible = true;
  marker.position.set(walkCam.position.x, (box ? box.max.y : 3) + 1, walkCam.position.z);
  marker.rotation.y = yaw;
  // The map always shows the measured floors, also under the photoreal layer.
  if (photoreal) for (const f of floors) f.material.visible = true;
  mapRenderer.render(scene, mapCam);
  if (photoreal) for (const f of floors) f.material.visible = false;
  marker.visible = false;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoreal Trainer (app)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<style>
  body { margin: 0; background: #0D1A1D; color: #E7EFEE; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  canvas { width: 100%; display: block; background: #000; }
  p { margin: 8px 12px; color: #9DB0AE; }
</style>
</head>
<body>
<canvas id="preview" width="480" height="360" aria-label="Preview of the model"></canvas>
<p id="state">Waiting for the photos…</p>
<script type="module">
// Driven by the Home Measure app (PhotorealTrainerView.swift) inside a WKWebView:
//   app -> page: hmReceive(base64) for each chunk of the scan photos zip, then
//                hmStart({ steps, width, maxSplats }); hmPause(true|false); hmStop().
//   page -> app: { type: 'ready' | 'loading' | 'progress' | 'ply' | 'done' | 'error', ... }
// The model comes back in the compact .splat format (the 'ply' messages keep their name).
// In a normal browser the messages go to window.hmTestSink (for the test page).
import { loadDataset } from './dataset.js';
import { createRenderer, initFromPoints, toSplat } from './gpu.js';

const post = (m) => (window.webkit?.messageHandlers?.hm ? window.webkit.messageHandlers.hm.postMessage(m) : window.hmTestSink?.(m));
const $ = (id) => document.getElementById(id);

// The status line in the iPhone's language (the web view reports it).
const WORDS = {
  en: { waiting: 'Waiting for the photos…', reading: 'Reading the photos…', training: 'Training…', cooling: 'Paused to let the phone cool down…', done: 'Done.' },
  he: { waiting: 'ממתין לתמונות…', reading: 'קורא את התמונות…', training: 'מתאמן…', cooling: 'עצירה קצרה כדי שהאייפון יתקרר…', done: 'הסתיים.' },
  th: { waiting: 'กำลังรอภาพ…', reading: 'กำลังอ่านภาพ…', training: 'กำลังฝึก…', cooling: 'หยุดสักครู่ให้ iPhone เย็นลง…', done: 'เสร็จแล้ว' },
};
const code = (navigator.language || 'en').slice(0, 2).toLowerCase();
const W = WORDS[code === 'iw' ? 'he' : code] ?? WORDS.en;
if (W === WORDS.he) document.documentElement.dir = 'rtl';
$('state').textContent = W.waiting;
const chunks = [];
let stopping = false;
let paused = false;

function fromBase64(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

function toBase64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function show(rgb, cam) {
  const c = $('preview');
  c.width = cam.width; c.height = cam.height;
  const ctx = c.getContext('2d');
  const im = ctx.createImageData(cam.width, cam.height);
  for (let p = 0; p < cam.width * cam.height; p++) {
    for (let ch = 0; ch < 3; ch++) im.data[p * 4 + ch] = Math.min(255, rgb[p * 3 + ch] * 255);
    im.data[p * 4 + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
}

window.hmReceive = (b64) => { chunks.push(fromBase64(b64)); return chunks.length; };
window.hmPause = (on) => { paused = !!on; $('state').textContent = paused ? W.cooling : W.training; };
window.hmStop = () => { stopping = true; };

window.hmStart = async ({ steps = 3000, width = 360, maxSplats = 150000 } = {}) => {
  try {
    const size = chunks.reduce((n, c) => n + c.length, 0);
    const zip = new Uint8Array(size);
    let at = 0;
    for (const c of chunks) { zip.set(c, at); at += c.length; }
    chunks.length = 0;
    $('state').textContent = W.reading;
    const data = await loadDataset(zip.buffer, { width, maxViews: 250, onProgress: (p) => post({ type: 'loading', share: p }) });
    const renderer = await createRenderer();
    const start = initFromPoints(data.points.count ? data.points : { xyz: new Float32Array(3), rgb: new Float32Array(3).fill(0.7), count: 1 });
    $('state').textContent = W.training;
    const trained = await renderer.trainScene(start, data.views, {
      steps,
      maxSplats,
      densifyFrom: Math.round(steps * 0.07),
      densifyUntil: Math.round(steps * 0.5),
      shouldStop: () => stopping,
      onProgress: async ({ step, loss, count }) => {
        post({ type: 'progress', step, steps, count, loss: Number.isFinite(loss) ? loss : -1 });
        while (paused && !stopping) await new Promise((r) => setTimeout(r, 1000));
      },
    });
    show(await renderer.render(trained, data.views[0].cam), data.views[0].cam);
    const ply = new Uint8Array(await toSplat(trained).arrayBuffer());
    const CHUNK = 1 << 20;
    for (let i = 0; i < ply.length; i += CHUNK) {
      post({ type: 'ply', data: toBase64(ply.subarray(i, i + CHUNK)), last: i + CHUNK >= ply.length });
    }
    $('state').textContent = W.done;
    post({ type: 'done', splats: ply.length / 32, bytes: ply.length });
  } catch (e) {
    $('state').textContent = e.message;
    post({ type: 'error', message: String(e.message ?? e) });
  }
};

post({ type: 'ready', gpu: !!navigator.gpu });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SSIM loss check</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Checks the GPU loss gradient (L1 + SSIM) against finite differences of the same
// loss computed here in plain JavaScript.
import { createRenderer } from './gpu.js';
const out = document.getElementById('out');
const W = 20, H = 14, C1 = 0.0001, C2 = 0.0009;

function loss(image, target, lambda) {
  let l1 = 0;
  for (let i = 0; i < image.length; i++) l1 += Math.abs(image[i] - target[i]);
  l1 /= image.length;
  let ssim = 0, windows = 0;
  for (let cy = 3; cy + 3 < H; cy++) for (let cx = 3; cx + 3 < W; cx++) for (let c = 0; c < 3; c++) {
    let mx = 0, my = 0, sxx = 0, syy = 0, sxy = 0;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const q = ((cy + dy) * W + cx + dx) * 3 + c;
      const x = image[q], y = target[q];
      mx += x; my += y; sxx += x * x; syy += y * y; sxy += x * y;
    }
    mx /= 49; my /= 49; sxx /= 49; syy /= 49; sxy /= 49;
    ssim += ((2 * mx * my + C1) * (2 * (sxy - mx * my) + C2)) / ((mx * mx + my * my + C1) * (sxx - mx * mx + syy - my * my + C2));
    windows++;
  }
  return (1 - lambda) * l1 + lambda * (1 - ssim / windows);
}

try {
  const r = await createRenderer();
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const target = Array.from({ length: W * H * 3 }, rand);
  const image = target.map((v) => Math.min(1, Math.max(0, v + (rand() - 0.5) * 0.3)));
  const lambda = 0.2;
  const gpu = await r.lossGradientOf(image, target, W, H, lambda);
  // L1 has a kink at x = y; the checked pixels are well away from it.
  let worst = 0, checked = 0;
  for (let k = 0; k < 40; k++) {
    const i = Math.floor(rand() * image.length);
    if (Math.abs(image[i] - target[i]) < 0.01) continue;
    const e = 1e-3;
    const up = image.slice(); up[i] += e;
    const down = image.slice(); down[i] -= e;
    const numeric = (loss(up, target, lambda) - loss(down, target, lambda)) / (2 * e);
    worst = Math.max(worst, Math.abs(numeric - gpu[i]) / Math.max(1e-6, Math.abs(numeric)));
    checked++;
  }
  const l1Only = await r.lossGradientOf(image, target, W, H, 0);
  const l1Ok = l1Only.every((g, i) => Math.abs(g - Math.sign(image[i] - target[i]) / image.length) < 1e-9);
  window.result = { checked, worstRelativeError: worst, l1Ok };
} catch (e) { window.result = { error: e.message }; }
out.textContent = JSON.stringify(window.result, null, 2);
</script>
</body>
</html>
